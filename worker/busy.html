<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>請稍後再試</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600&family=Noto+Sans+TC:wght@300;500&display=swap">
<style>
:root{--paper:#f7f5fa;--ink:#2a2637;--mute:#6f6a7d;--violet:#6a5a96;}
@media (prefers-color-scheme:dark){
  :root{--paper:#15131e;--ink:#e9e5f2;--mute:#948da8;--violet:#a394d4;}
}
*{box-sizing:border-box;}
body{
  margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:'Noto Sans TC',system-ui,sans-serif;font-weight:300;line-height:1.8;
  display:grid;place-items:center;padding:32px;
}
.box{max-width:32ch;text-align:center;}
h1{font-family:'Noto Serif TC',serif;font-size:1.4rem;font-weight:600;margin:0 0 10px;}
p{color:var(--mute);font-size:.92rem;margin:0 0 8px;}
a{color:var(--violet);}
</style>
</head>
<body>
<div class="box">
  <h1>現在有點忙，請稍後再試</h1>
  <p>同一時間打開的人比較多，暫時讀不到資料。</p>
  <p>請過一兩分鐘再重新整理這一頁，連結本身沒有問題。</p>
  <p><a href="{{churchSite}}">前往黎明教會網站</a></p>
</div>
</body>
</html>
